# ===========================================
# Конфігурація Prometheus (мінімальна для dev/test)
# ===========================================

# --- Server ---
server:
  persistentVolume:
    enabled: false
  
  # Мінімальні ресурси
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

  retention: "1d"

# --- AlertManager ---
alertmanager:
  enabled: false

# --- PushGateway ---
pushgateway:
  enabled: false

# --- Node Exporter ---
nodeExporter:
  enabled: true

# --- Kube State Metrics ---
kubeStateMetrics:
  enabled: true
